title: William Jones
description: The website of William Jones.
url: "https://willjones-0.github.io"
baseurl: ""
author: William Jones
timezone: London
permalink: /writing/:title/
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
defaults:
