<header class="site-header">

  <nav aria-label="Primary navigation">
    <a {% if page.url == '/' %}aria-current="page"{% endif %} href="{{ '/' | relative_url }}">Home</a>
    <a {% if page.url contains '/writing/' %}aria-current="page"{% endif %} href="{{ '/writing/' | relative_url }}">Writing</a>
    <a {% if page.url contains '/videos/' %}aria-current="page"{% endif %} href="{{ '/videos/' | relative_url }}">Videos</a>
    <a {% if page.url contains '/projects/' %}aria-current="page"{% endif %} href="{{ '/projects/' | relative_url }}">Projects</a>
    <a {% if page.url contains '/about/' %}aria-current="page"{% endif %} href="{{ '/about/' | relative_url }}">About</a>
  </nav>
</header>
