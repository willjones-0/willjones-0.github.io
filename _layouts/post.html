---
layout: default
---
<article class="post">
  <header class="post-header">
    <p class="eyebrow">Writing</p>
    <h1>{{ page.title }}</h1>
    <p class="meta"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%e %B %Y" }}</time>{% if page.reading_time %}<span aria-hidden="true"> · </span>{{ page.reading_time }} min read{% endif %}</p>
  </header>
  <div class="prose">{{ content }}</div>
</article>
<nav class="post-nav" aria-label="More writing"><a href="{{ '/writing/' | relative_url }}">← All writing</a></nav>
